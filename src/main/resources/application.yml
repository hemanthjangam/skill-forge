spring:
  application:
    name: skill-forge
  profiles:
    active: ${APP_PROFILE:dev}
  config:
    import: optional:file:.env[.properties]
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

app:
  ai:
    provider: ${AI_PROVIDER:gemini}
    gemini:
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-2.5-flash}
      timeout-ms: ${GEMINI_TIMEOUT_MS:30000}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model: ${OLLAMA_MODEL:qwen2.5:14b}
      tutor-model: ${OLLAMA_TUTOR_MODEL:${OLLAMA_MODEL:qwen2.5:14b}}
      generation-model: ${OLLAMA_GENERATION_MODEL:${OLLAMA_MODEL:qwen2.5:14b}}
      timeout-ms: ${OLLAMA_TIMEOUT_MS:240000}
